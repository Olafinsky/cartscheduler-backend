<!doctype html>
<html lang="pl" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Logowanie')}"></head>
<body class="d-flex align-items-center min-vh-100">
<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-sm-10 col-md-7 col-lg-5 col-xl-4">
            <section class="card content-card">
                <div class="card-body p-4 p-lg-5">
                    <div class="text-center mb-4">
                        <div class="admin-brand-mark login-brand-mark mb-3"><i class="bi bi-calendar2-week"></i></div>
                        <h1 class="h3 page-heading mb-1">Panel administracyjny</h1>
                        <p class="text-secondary mb-0">Zaloguj się, aby zarządzać grafikami.</p>
                    </div>
                    <div th:if="${param.error}" class="alert alert-danger" role="alert">
                        Nieprawidłowa nazwa użytkownika lub hasło.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success" role="alert">
                        Zostałeś poprawnie wylogowany.
                    </div>
                    <form th:action="@{/login}" method="post" novalidate autocomplete="off">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="mb-3">
                            <label for="username" class="form-label">Nazwa użytkownika</label>
                            <input id="username" name="username" type="text" class="form-control" autocomplete="off" autofocus required>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label">Hasło</label>
                            <input id="password" name="password" type="password" class="form-control" autocomplete="off" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Zaloguj</button>
                    </form>
                </div>
            </section>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
