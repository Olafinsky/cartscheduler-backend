<!doctype html>
<html lang="pl" xmlns:th="https://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} + ' | CartScheduler'">CartScheduler</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/admin.css}" rel="stylesheet">
</head>
<body>
<nav th:fragment="navigation" class="navbar navbar-expand-lg navbar-light admin-navbar">
    <div class="container-fluid admin-navbar__inner">
        <a class="navbar-brand fw-semibold" th:href="@{/admin}">
            <span class="admin-brand-mark"><i class="bi bi-calendar2-week"></i></span>
            <span>CartScheduler</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNavigation"
                aria-controls="adminNavigation" aria-expanded="false" aria-label="Przełącz nawigację">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="adminNavigation">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" th:href="@{/admin}">Podsumowanie</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/admin/users}">Użytkownicy</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/admin/participants}">Uczestnicy</a></li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="configurationNavigation" role="button"
                       data-bs-toggle="dropdown" aria-expanded="false">Konfiguracja</a>
                    <ul class="dropdown-menu admin-config-menu" aria-labelledby="configurationNavigation">
                        <li><a class="dropdown-item" th:href="@{/admin/config/generation}">Generowanie grafiku</a></li>
                        <li><a class="dropdown-item" th:href="@{/admin/config/participant-rules}">Reguły uczestników</a></li>
                        <li><a class="dropdown-item" th:href="@{/admin/config/pair-rules}">Reguły par</a></li>
                        <li><a class="dropdown-item" th:href="@{/admin/config/candidate-assignment-scores}">Punktacja przydziałów uczestników</a></li>
                        <li><a class="dropdown-item" th:href="@{/admin/config/pair-assignment-scores}">Punktacja wystąpień par</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" th:href="@{/admin/config/schedule-days}">Dni grafiku</a></li>
                        <li><a class="dropdown-item" th:href="@{/admin/config/restricted-dates}">Daty zastrzeżone</a></li>
                    </ul>
                </li>
                <li class="nav-item"><a class="nav-link" th:href="@{/admin/schedules}">Grafiki</a></li>
            </ul>
            <form th:action="@{/logout}" method="post" class="d-flex">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-box-arrow-right me-1"></i>Wyloguj
                </button>
            </form>
        </div>
    </div>
</nav>

<div th:fragment="alerts" class="mb-4">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Zamknij"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Zamknij"></button>
    </div>
</div>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
</th:block>
</body>
</html>
