<!doctype html>
<html lang="pl" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Podgląd uczestnika')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navigation}"></nav>
<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div><h1 class="page-heading h2 mb-1">Podgląd uczestnika</h1><p class="text-secondary mb-0" th:text="${participant.name}"></p></div>
        <div class="d-flex gap-2"><a class="btn btn-outline-secondary" th:href="@{/admin/participants}">Wróć do listy</a><a class="btn btn-primary" th:href="@{/admin/participants/{id}/edit(id=${participant.id})}"><i class="bi bi-pencil me-1"></i>Edytuj</a></div>
    </div>
    <section class="card content-card mb-4"><div class="table-responsive"><table class="table mb-0"><tbody>
        <tr><th scope="row" class="w-25">ID</th><td th:text="${participant.id}"></td></tr>
        <tr><th scope="row">Nazwa</th><td th:text="${participant.name}"></td></tr>
        <tr><th scope="row">E-mail</th><td th:text="${participant.email}"></td></tr>
        <tr><th scope="row">Aktywny</th><td th:text="${participant.enabled} ? 'Tak' : 'Nie'"></td></tr>
        <tr><th scope="row">Autoprzydział w nowym grafiku</th><td th:text="${participant.newScheduleAutoassignmentEnabled} ? 'Tak' : 'Nie'"></td></tr>
        <tr><th scope="row">Autozaproszenie do nowego grafiku</th><td th:text="${participant.newScheduleAutoinvitementEnabled} ? 'Tak' : 'Nie'"></td></tr>
        <tr><th scope="row">Wybór uczestnika do pary</th><td th:text="${participant.allowPairSelection} ? 'Tak' : 'Nie'"></td></tr>
        <tr><th scope="row">Wybór grupy alternatywnej</th><td th:text="${participant.allowAlternativeGroupSelection} ? 'Tak' : 'Nie'"></td></tr>
    </tbody></table></div></section>
    <section class="card content-card"><div class="card-body"><h2 class="h5 page-heading">Przypisani uczestnicy</h2>
        <ul class="mb-0" th:if="${!#lists.isEmpty(assignedParticipants)}"><li th:each="assignedParticipant : ${assignedParticipants}" th:text="${assignedParticipant.name + ' (' + assignedParticipant.email + ')'}"></li></ul>
        <p class="text-secondary mb-0" th:if="${#lists.isEmpty(assignedParticipants)}">Brak przypisanych uczestników.</p>
    </div></section>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
