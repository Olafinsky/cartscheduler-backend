<!doctype html>
<html lang="pl" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Grafiki')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navigation}"></nav>
<main class="container py-4">
    <div class="mb-4"><h1 class="page-heading h2 mb-1">Grafiki</h1><p class="text-secondary mb-0">Dostępne grafiki wraz z liczbą dni służby.</p></div>
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <section class="card content-card"><div class="table-responsive"><table class="table table-hover align-middle mb-0">
        <thead class="table-light"><tr><th>ID</th><th>Nazwa</th><th>Liczba dni</th><th class="actions-column">Akcje</th></tr></thead>
        <tbody>
        <tr th:each="schedule : ${schedules}">
            <td th:text="${schedule.id}"></td><td class="fw-semibold" th:text="${schedule.name}"></td><td th:text="${schedule.dayCount}"></td>
            <td class="actions-column"><a class="btn btn-sm btn-outline-primary icon-action" th:href="@{/admin/schedules/{id}(id=${schedule.id})}" aria-label="Podgląd" title="Podgląd"><i class="bi bi-eye"></i></a>
                <a class="btn btn-sm btn-outline-primary icon-action" th:href="@{/admin/schedules/{id}/edit(id=${schedule.id})}" aria-label="Edytuj" title="Edytuj"><i class="bi bi-pencil"></i></a>
                <form class="d-inline" th:action="@{/admin/schedules/{id}/delete(id=${schedule.id})}" method="post" onsubmit="return confirm('Usunąć ten grafik? Zostaną usunięte także jego dni i powiązane dane.');"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-sm btn-outline-danger icon-action" type="submit" aria-label="Usuń" title="Usuń"><i class="bi bi-trash"></i></button></form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(schedules)}"><td colspan="4" class="text-center text-secondary py-4">Brak grafików.</td></tr>
        </tbody>
    </table></div></section>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
