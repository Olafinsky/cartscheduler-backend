<!doctype html>
<html lang="pl" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Podgląd punktacji przydziałów uczestników')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navigation}"></nav>
<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4"><div><h1 class="page-heading h2 mb-1">Podgląd punktacji przydziałów uczestników</h1><p class="text-secondary mb-0">Szczegóły zakresu punktowego.</p></div><div class="d-flex gap-2"><a class="btn btn-outline-secondary" th:href="@{/admin/config/candidate-assignment-scores}">Wróć do listy</a><a class="btn btn-primary" th:href="@{/admin/config/candidate-assignment-scores/{id}/edit(id=${score.id})}"><i class="bi bi-pencil me-1"></i>Edytuj</a></div></div>
    <section class="card content-card"><div class="table-responsive"><table class="table mb-0"><tbody><tr><th scope="row" class="w-50">ID</th><td th:text="${score.id}"></td></tr><tr><th scope="row">Ilość przydziałów OD</th><td th:text="${score.assignmentCountFrom}"></td></tr><tr><th scope="row">Ilość przydziałów DO</th><td th:text="${score.assignmentCountTo}"></td></tr><tr><th scope="row">Punkty za każde przydzielenie</th><td th:text="${score.points}"></td></tr></tbody></table></div></section>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
