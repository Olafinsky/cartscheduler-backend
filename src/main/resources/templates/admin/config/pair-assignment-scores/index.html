<!doctype html>
<html lang="pl" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Punktacja wystąpień par')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navigation}"></nav>
<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <h1 class="page-heading h2 mb-1">Punktacja wystąpień par</h1>
            <p class="text-secondary mb-0">Konfiguracja premii za częstotliwość występowania par.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/admin/config/pair-assignment-scores/new}"><i class="bi bi-plus-lg me-1"></i>Dodaj punktację</a>
    </div>
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <section class="card content-card"><div class="table-responsive"><table class="table table-hover align-middle mb-0">
        <thead class="table-light"><tr><th>ID</th><th>Ilość wystąpień pary OD</th><th>Ilość wystąpień pary DO</th><th>Punkty za każde wystąpienie pary</th><th class="actions-column">Akcje</th></tr></thead>
        <tbody>
        <tr th:each="score : ${scores}">
            <td th:text="${score.id}"></td>
            <td th:text="${score.assignmentCountFrom}"></td>
            <td th:text="${score.assignmentCountTo}"></td>
            <td th:text="${score.points}"></td>
            <td class="actions-column">
                <a class="btn btn-sm btn-outline-primary icon-action" th:href="@{/admin/config/pair-assignment-scores/{id}(id=${score.id})}" aria-label="Podgląd" title="Podgląd"><i class="bi bi-eye"></i></a>
                <a class="btn btn-sm btn-outline-secondary icon-action" th:href="@{/admin/config/pair-assignment-scores/{id}/edit(id=${score.id})}" aria-label="Edytuj" title="Edytuj"><i class="bi bi-pencil"></i></a>
                <form class="d-inline" th:action="@{/admin/config/pair-assignment-scores/{id}/delete(id=${score.id})}" method="post" onsubmit="return confirm('Usunąć tę punktację?');">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button class="btn btn-sm btn-outline-danger icon-action" type="submit" aria-label="Usuń" title="Usuń"><i class="bi bi-trash"></i></button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(scores)}"><td colspan="5" class="text-center text-secondary py-4">Brak skonfigurowanej punktacji.</td></tr>
        </tbody>
    </table></div></section>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
