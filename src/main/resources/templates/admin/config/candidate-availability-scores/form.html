<!doctype html>
<html lang="pl" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${editing} ? 'Edycja punktacji dostępności' : 'Nowa punktacja dostępności')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navigation}"></nav>
<main class="container py-4">
    <div class="mb-4"><h1 class="page-heading h2 mb-1" th:text="${editing} ? 'Edycja punktacji dostępności' : 'Nowa punktacja dostępności'"></h1><p class="text-secondary mb-0">Zakres liczby wystąpień jest domknięty.</p></div>
    <section class="card content-card"><div class="card-body p-4"><form th:object="${form}" th:action="${editing} ? @{/admin/config/candidate-availability-scores/{id}/edit(id=${scoreId})} : @{/admin/config/candidate-availability-scores}" method="post" novalidate autocomplete="off">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="row g-3"><div class="col-md-4"><label class="form-label" for="appearanceCountFrom">Od liczby wystąpień *</label><input id="appearanceCountFrom" type="number" min="0" step="1" class="form-control" th:field="*{appearanceCountFrom}" th:classappend="${#fields.hasErrors('appearanceCountFrom')} ? ' is-invalid' : ''"><div class="invalid-feedback" th:errors="*{appearanceCountFrom}"></div></div><div class="col-md-4"><label class="form-label" for="appearanceCountTo">Do liczby wystąpień *</label><input id="appearanceCountTo" type="number" min="0" step="1" class="form-control" th:field="*{appearanceCountTo}" th:classappend="${#fields.hasErrors('appearanceCountTo')} ? ' is-invalid' : ''"><div class="invalid-feedback" th:errors="*{appearanceCountTo}"></div></div><div class="col-md-4"><label class="form-label" for="points">Punkty *</label><input id="points" type="number" step="1" class="form-control" th:field="*{points}" th:classappend="${#fields.hasErrors('points')} ? ' is-invalid' : ''"><div class="invalid-feedback" th:errors="*{points}"></div></div></div>
        <div class="mt-4 d-flex gap-2"><button type="submit" class="btn btn-primary" th:text="${editing} ? 'Zapisz' : 'Dodaj'"></button><a class="btn btn-outline-secondary" th:href="@{/admin/config/candidate-availability-scores}">Anuluj</a></div>
    </form></div></section>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
