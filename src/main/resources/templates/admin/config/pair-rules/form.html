<!doctype html>
<html lang="pl" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${editing} ? 'Edycja reguły pary' : 'Nowa reguła pary')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navigation}"></nav>
<main class="container py-4">
    <div class="mb-4"><h1 class="page-heading h2 mb-1" th:text="${editing} ? 'Edycja reguły pary' : 'Nowa reguła pary'"></h1><p class="text-secondary mb-0">Wybierz dwóch różnych uczestników. Kolejność wyboru nie ma znaczenia.</p></div>
    <section class="card content-card"><div class="card-body p-4"><form th:object="${form}" th:action="${editing} ? @{/admin/config/pair-rules/{id}/edit(id=${ruleId})} : @{/admin/config/pair-rules}" method="post" novalidate autocomplete="off">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="row g-3">
            <div class="col-md-6"><label class="form-label" for="participant1Id">Uczestnik 1 *</label><select id="participant1Id" class="form-select" th:field="*{participant1Id}" th:classappend="${#fields.hasErrors('participant1Id')} ? ' is-invalid' : ''"><option value="">Wybierz uczestnika</option><option th:each="participant : ${participants}" th:value="${participant.id}" th:text="${participant.name + ' (' + participant.email + ')'}"></option></select><div class="invalid-feedback" th:errors="*{participant1Id}"></div></div>
            <div class="col-md-6"><label class="form-label" for="participant2Id">Uczestnik 2 *</label><select id="participant2Id" class="form-select" th:field="*{participant2Id}" th:classappend="${#fields.hasErrors('participant2Id')} ? ' is-invalid' : ''"><option value="">Wybierz uczestnika</option><option th:each="participant : ${participants}" th:value="${participant.id}" th:text="${participant.name + ' (' + participant.email + ')'}"></option></select><div class="invalid-feedback" th:errors="*{participant2Id}"></div></div>
            <div class="col-md-6"><label class="form-label" for="compatibilityMode">Tryb zgodności *</label><select id="compatibilityMode" class="form-select" th:field="*{compatibilityMode}" th:classappend="${#fields.hasErrors('compatibilityMode')} ? ' is-invalid' : ''"><option th:each="mode : ${compatibilityModes}" th:value="${mode}" th:text="${compatibilityModeLabels.get(mode)}"></option></select><div class="invalid-feedback" th:errors="*{compatibilityMode}"></div></div>
            <div class="col-md-6"><label class="form-label" for="scorePoints">Punkty *</label><input id="scorePoints" type="number" step="1" class="form-control" th:field="*{scorePoints}" th:classappend="${#fields.hasErrors('scorePoints')} ? ' is-invalid' : ''"><div class="invalid-feedback" th:errors="*{scorePoints}"></div></div>
        </div>
        <div class="mt-4 d-flex gap-2"><button type="submit" class="btn btn-primary" th:text="${editing} ? 'Zapisz' : 'Dodaj'"></button><a class="btn btn-outline-secondary" th:href="@{/admin/config/pair-rules}">Anuluj</a></div>
    </form></div></section>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
