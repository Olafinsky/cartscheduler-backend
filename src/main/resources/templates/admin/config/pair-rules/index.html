<!doctype html>
<html lang="pl" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Reguły par')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navigation}"></nav>
<main class="container-fluid py-4 px-lg-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div><h1 class="page-heading h2 mb-1">Reguły par</h1><p class="text-secondary mb-0">Zgodność oraz punktacja konkretnych par uczestników.</p></div>
        <a class="btn btn-primary" th:href="@{/admin/config/pair-rules/new}"><i class="bi bi-plus-lg me-1"></i>Dodaj regułę</a>
    </div>
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <section class="card content-card"><div class="table-responsive"><table class="table table-hover align-middle mb-0">
        <thead class="table-light"><tr><th>ID</th><th>Uczestnik 1</th><th>Uczestnik 2</th><th>Tryb zgodności</th><th>Punkty</th><th class="actions-column">Akcje</th></tr></thead>
        <tbody>
        <tr th:each="rule : ${rules}">
            <td th:text="${rule.id}"></td><td class="fw-semibold" th:text="${rule.participant1.name}"></td><td class="fw-semibold" th:text="${rule.participant2.name}"></td><td th:text="${compatibilityModeLabels.get(rule.compatibilityMode)}"></td><td th:text="${rule.scorePoints}"></td>
            <td class="actions-column"><a class="btn btn-sm btn-outline-primary icon-action" th:href="@{/admin/config/pair-rules/{id}(id=${rule.id})}" aria-label="Podgląd" title="Podgląd"><i class="bi bi-eye"></i></a><a class="btn btn-sm btn-outline-secondary icon-action" th:href="@{/admin/config/pair-rules/{id}/edit(id=${rule.id})}" aria-label="Edytuj" title="Edytuj"><i class="bi bi-pencil"></i></a><form class="d-inline" th:action="@{/admin/config/pair-rules/{id}/delete(id=${rule.id})}" method="post" onsubmit="return confirm('Usunąć tę regułę pary?');"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-sm btn-outline-danger icon-action" type="submit" aria-label="Usuń" title="Usuń"><i class="bi bi-trash"></i></button></form></td>
        </tr>
        <tr th:if="${#lists.isEmpty(rules)}"><td colspan="6" class="text-center text-secondary py-4">Brak reguł par.</td></tr>
        </tbody>
    </table></div></section>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
