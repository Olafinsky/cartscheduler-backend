<!doctype html>
<html lang="pl" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Podgląd reguły uczestnika')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navigation}"></nav>
<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4"><div><h1 class="page-heading h2 mb-1">Podgląd reguły uczestnika</h1><p class="text-secondary mb-0" th:text="${rule.participant.name}"></p></div><div class="d-flex gap-2"><a class="btn btn-outline-secondary" th:href="@{/admin/config/participant-rules}">Wróć do listy</a><a class="btn btn-primary" th:href="@{/admin/config/participant-rules/{id}/edit(id=${rule.id})}"><i class="bi bi-pencil me-1"></i>Edytuj</a></div></div>
    <section class="card content-card"><div class="table-responsive"><table class="table mb-0"><tbody>
        <tr><th scope="row" class="w-50">ID</th><td th:text="${rule.id}"></td></tr>
        <tr><th scope="row">Uczestnik</th><td th:text="${rule.participant.name + ' (' + rule.participant.email + ')'}"></td></tr>
        <tr><th scope="row">Minimalna długość służby</th><td th:text="${rule.serviceLengthMin == null ? '—' : rule.serviceLengthMin + ' h'}"></td></tr>
        <tr><th scope="row">Maksymalna długość służby</th><td th:text="${rule.serviceLengthMax == null ? '—' : rule.serviceLengthMax + ' h'}"></td></tr>
        <tr><th scope="row">Minimalna długość przerwy</th><td th:text="${rule.breakLengthMin == null ? '—' : rule.breakLengthMin + ' h'}"></td></tr>
        <tr><th scope="row">Maksymalna długość przerwy</th><td th:text="${rule.breakLengthMax == null ? '—' : rule.breakLengthMax + ' h'}"></td></tr>
        <tr><th scope="row">Punkty uprzywilejowania</th><td th:text="${rule.privilegePoints == null ? '—' : rule.privilegePoints}"></td></tr>
    </tbody></table></div></section>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
