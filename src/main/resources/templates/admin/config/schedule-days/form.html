<!doctype html>
<html lang="pl" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${editing} ? 'Edycja dnia grafiku' : 'Nowy dzień grafiku')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navigation}"></nav>
<main class="container py-4">
    <div class="mb-4"><h1 class="page-heading h2 mb-1" th:text="${editing} ? 'Edycja dnia grafiku' : 'Nowy dzień grafiku'"></h1><p class="text-secondary mb-0">Dla każdego dnia tygodnia można utworzyć jeden wpis.</p></div>
    <section class="card content-card"><div class="card-body p-4"><form th:object="${form}" th:action="${editing} ? @{/admin/config/schedule-days/{id}/edit(id=${scheduleDayId})} : @{/admin/config/schedule-days}" method="post" novalidate autocomplete="off">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="row g-3"><div class="col-md-4"><label class="form-label" for="dayOfWeek">Dzień tygodnia *</label><select id="dayOfWeek" class="form-select" th:field="*{dayOfWeek}" th:classappend="${#fields.hasErrors('dayOfWeek')} ? ' is-invalid' : ''"><option value="">Wybierz dzień</option><option value="1">Poniedziałek</option><option value="2">Wtorek</option><option value="3">Środa</option><option value="4">Czwartek</option><option value="5">Piątek</option><option value="6">Sobota</option><option value="7">Niedziela</option></select><div class="invalid-feedback" th:errors="*{dayOfWeek}"></div></div><div class="col-md-4"><label class="form-label" for="hourFrom">Godzina od *</label><input id="hourFrom" type="number" min="0" max="23" step="1" class="form-control" th:field="*{hourFrom}" th:classappend="${#fields.hasErrors('hourFrom')} ? ' is-invalid' : ''"><div class="invalid-feedback" th:errors="*{hourFrom}"></div></div><div class="col-md-4"><label class="form-label" for="hourTo">Godzina do *</label><input id="hourTo" type="number" min="0" max="23" step="1" class="form-control" th:field="*{hourTo}" th:classappend="${#fields.hasErrors('hourTo')} ? ' is-invalid' : ''"><div class="invalid-feedback" th:errors="*{hourTo}"></div></div></div>
        <div class="form-check mt-4"><input type="hidden" name="_active" value="on"><input id="active" class="form-check-input" type="checkbox" th:field="*{active}"><label class="form-check-label" for="active">Dzień aktywny</label></div>
        <div class="mt-4 d-flex gap-2"><button type="submit" class="btn btn-primary" th:text="${editing} ? 'Zapisz' : 'Dodaj'"></button><a class="btn btn-outline-secondary" th:href="@{/admin/config/schedule-days}">Anuluj</a></div>
    </form></div></section>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
