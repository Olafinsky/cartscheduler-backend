<!doctype html>
<html lang="pl" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Dni grafiku')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navigation}"></nav>
<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4"><div><h1 class="page-heading h2 mb-1">Dni grafiku</h1><p class="text-secondary mb-0">Godziny służby dla poszczególnych dni tygodnia.</p></div><a class="btn btn-primary" th:href="@{/admin/config/schedule-days/new}"><i class="bi bi-plus-lg me-1"></i>Dodaj dzień</a></div>
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <section class="card content-card"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="table-light"><tr><th>ID</th><th>Dzień tygodnia</th><th>Godziny służby</th><th>Aktywny</th><th class="actions-column">Akcje</th></tr></thead><tbody>
        <tr th:each="scheduleDay : ${scheduleDays}"><td th:text="${scheduleDay.id}"></td><td class="fw-semibold" th:text="${weekdayNames.get(scheduleDay.dayOfWeek)}"></td><td class="schedule-hours" th:text="${scheduleDay.hourFrom + ':00–' + scheduleDay.hourTo + ':00'}"></td><td><i th:class="${scheduleDay.active ? 'bi bi-check-circle-fill text-success' : 'bi bi-x-circle-fill text-secondary'}" th:attr="aria-label=${scheduleDay.active ? 'Tak' : 'Nie'}"></i></td><td class="actions-column"><a class="btn btn-sm btn-outline-primary icon-action" th:href="@{/admin/config/schedule-days/{id}(id=${scheduleDay.id})}" aria-label="Podgląd" title="Podgląd"><i class="bi bi-eye"></i></a><a class="btn btn-sm btn-outline-secondary icon-action" th:href="@{/admin/config/schedule-days/{id}/edit(id=${scheduleDay.id})}" aria-label="Edytuj" title="Edytuj"><i class="bi bi-pencil"></i></a><form class="d-inline" th:action="@{/admin/config/schedule-days/{id}/delete(id=${scheduleDay.id})}" method="post" onsubmit="return confirm('Usunąć konfigurację tego dnia?');"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-sm btn-outline-danger icon-action" type="submit" aria-label="Usuń" title="Usuń"><i class="bi bi-trash"></i></button></form></td></tr>
        <tr th:if="${#lists.isEmpty(scheduleDays)}"><td colspan="5" class="text-center text-secondary py-4">Brak skonfigurowanych dni.</td></tr>
    </tbody></table></div></section>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
