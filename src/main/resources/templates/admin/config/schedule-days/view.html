<!doctype html>
<html lang="pl" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Podgląd dnia grafiku')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navigation}"></nav>
<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4"><div><h1 class="page-heading h2 mb-1">Podgląd dnia grafiku</h1><p class="text-secondary mb-0" th:text="${weekdayNames.get(scheduleDay.dayOfWeek)}"></p></div><div class="d-flex gap-2"><a class="btn btn-outline-secondary" th:href="@{/admin/config/schedule-days}">Wróć do listy</a><a class="btn btn-primary" th:href="@{/admin/config/schedule-days/{id}/edit(id=${scheduleDay.id})}"><i class="bi bi-pencil me-1"></i>Edytuj</a></div></div>
    <section class="card content-card"><div class="table-responsive"><table class="table mb-0"><tbody><tr><th scope="row" class="w-50">ID</th><td th:text="${scheduleDay.id}"></td></tr><tr><th scope="row">Dzień tygodnia</th><td th:text="${weekdayNames.get(scheduleDay.dayOfWeek)}"></td></tr><tr><th scope="row">Godzina od</th><td th:text="${scheduleDay.hourFrom + ':00'}"></td></tr><tr><th scope="row">Godzina do</th><td th:text="${scheduleDay.hourTo + ':00'}"></td></tr><tr><th scope="row">Aktywny</th><td th:text="${scheduleDay.active ? 'Tak' : 'Nie'}"></td></tr></tbody></table></div></section>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
