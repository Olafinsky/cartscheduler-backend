<!doctype html>
<html lang="pl" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Daty zastrzeżone')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navigation}"></nav>
<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div><h1 class="page-heading h2 mb-1">Daty zastrzeżone</h1><p class="text-secondary mb-0">Daty, dla których nie należy tworzyć dni grafiku.</p></div>
        <a class="btn btn-primary" th:href="@{/admin/config/restricted-dates/new}"><i class="bi bi-calendar-plus me-1"></i>Dodaj datę</a>
    </div>
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <section class="card content-card"><div class="table-responsive"><table class="table table-hover align-middle mb-0">
        <thead class="table-light"><tr><th>ID</th><th>Data</th><th class="actions-column">Akcje</th></tr></thead>
        <tbody>
        <tr th:each="restrictedDate : ${restrictedDates}">
            <td th:text="${restrictedDate.id}"></td>
            <td class="fw-semibold" th:text="${#temporals.format(restrictedDate.restrictedDate, 'dd.MM.yyyy')}"></td>
            <td class="actions-column">
                <a class="btn btn-sm btn-outline-primary icon-action" th:href="@{/admin/config/restricted-dates/{id}(id=${restrictedDate.id})}" aria-label="Podgląd" title="Podgląd"><i class="bi bi-eye"></i></a>
                <a class="btn btn-sm btn-outline-secondary icon-action" th:href="@{/admin/config/restricted-dates/{id}/edit(id=${restrictedDate.id})}" aria-label="Edytuj" title="Edytuj"><i class="bi bi-pencil"></i></a>
                <form class="d-inline" th:action="@{/admin/config/restricted-dates/{id}/delete(id=${restrictedDate.id})}" method="post" onsubmit="return confirm('Usunąć tę datę zastrzeżoną?');">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button class="btn btn-sm btn-outline-danger icon-action" type="submit" aria-label="Usuń" title="Usuń"><i class="bi bi-trash"></i></button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(restrictedDates)}"><td colspan="3" class="text-center text-secondary py-4">Brak dat zastrzeżonych.</td></tr>
        </tbody>
    </table></div></section>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
