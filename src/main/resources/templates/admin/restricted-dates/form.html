<!doctype html>
<html lang="pl" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Data zastrzeżona')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navigation}"></nav>
<main class="container py-4">
    <div class="mb-4"><h1 class="page-heading h2 mb-1" th:text="${editing} ? 'Edycja daty zastrzeżonej' : 'Nowa data zastrzeżona'"></h1><p class="text-secondary mb-0">Wybierz dzień, w którym grafik nie powinien być tworzony.</p></div>
    <section class="card content-card"><div class="card-body p-4"><form th:object="${form}" th:action="${editing} ? @{/admin/config/restricted-dates/{id}/edit(id=${restrictedDateId})} : @{/admin/config/restricted-dates}" method="post" novalidate autocomplete="off">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="col-md-6 px-0">
            <label for="restrictedDate" class="form-label">Data *</label>
            <input id="restrictedDate" type="date" class="form-control" th:field="*{restrictedDate}" th:classappend="${#fields.hasErrors('restrictedDate')} ? ' is-invalid' : ''">
            <div class="invalid-feedback" th:errors="*{restrictedDate}"></div>
        </div>
        <div class="mt-4 d-flex gap-2"><button type="submit" class="btn btn-primary" th:text="${editing} ? 'Zapisz' : 'Dodaj'"></button><a class="btn btn-outline-secondary" th:href="@{/admin/config/restricted-dates}">Anuluj</a></div>
    </form></div></section>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
