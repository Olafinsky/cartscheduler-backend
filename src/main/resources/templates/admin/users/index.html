<!doctype html>
<html lang="pl" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Użytkownicy')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navigation}"></nav>
<main class="container-fluid py-4 px-lg-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <h1 class="page-heading h2 mb-1">Użytkownicy</h1>
            <p class="text-secondary mb-0">Konta uprawnione do korzystania z panelu administracyjnego.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/admin/users/new}"><i class="bi bi-person-plus me-1"></i>Dodaj użytkownika</a>
    </div>
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <section class="card content-card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr><th>ID</th><th>Login</th><th>Nazwa</th><th>E-mail</th><th>Utworzono</th><th>Ostatnie logowanie</th><th class="actions-column">Akcje</th></tr>
                </thead>
                <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.id}"></td>
                    <td class="fw-semibold" th:text="${user.username}"></td>
                    <td th:text="${user.name}"></td>
                    <td th:text="${user.email}"></td>
                    <td th:text="${#temporals.format(user.createdAt, 'dd.MM.yyyy HH:mm')}"></td>
                    <td th:text="${user.dateLastLogin == null ? '—' : #temporals.format(user.dateLastLogin, 'dd.MM.yyyy HH:mm')}"></td>
                    <td class="actions-column">
                        <a class="btn btn-sm btn-outline-primary icon-action" th:href="@{/admin/users/{id}(id=${user.id})}" aria-label="Podgląd" title="Podgląd"><i class="bi bi-eye"></i></a>
                        <a class="btn btn-sm btn-outline-secondary icon-action" th:href="@{/admin/users/{id}/edit(id=${user.id})}" aria-label="Edytuj" title="Edytuj"><i class="bi bi-pencil"></i></a>
                        <form class="d-inline" th:action="@{/admin/users/{id}/delete(id=${user.id})}" method="post" onsubmit="return confirm('Usunąć tego użytkownika?');">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button class="btn btn-sm btn-outline-danger icon-action" type="submit" aria-label="Usuń" title="Usuń"><i class="bi bi-trash"></i></button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(users)}"><td colspan="7" class="text-center text-secondary py-4">Brak użytkowników.</td></tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
