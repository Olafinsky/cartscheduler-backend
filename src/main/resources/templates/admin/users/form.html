<!doctype html>
<html lang="pl" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${editing} ? 'Edycja użytkownika' : 'Nowy użytkownik')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navigation}"></nav>
<main class="container py-4">
    <div class="mb-4">
        <h1 class="page-heading h2 mb-1" th:text="${editing} ? 'Edycja użytkownika' : 'Nowy użytkownik'"></h1>
        <p class="text-secondary mb-0">Pola oznaczone gwiazdką są wymagane.</p>
    </div>
    <section class="card content-card">
        <div class="card-body p-4">
            <form th:object="${form}" th:action="${editing} ? @{/admin/users/{id}/edit(id=${userId})} : @{/admin/users}" method="post" novalidate autocomplete="off">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label" for="username">Nazwa użytkownika *</label>
                        <input id="username" type="text" class="form-control" th:field="*{username}" autocomplete="off" th:classappend="${#fields.hasErrors('username')} ? ' is-invalid' : ''">
                        <div class="invalid-feedback" th:errors="*{username}"></div>
                        <div class="form-text">Od 8 do 128 znaków.</div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="name">Imię i nazwisko *</label>
                        <input id="name" type="text" class="form-control" th:field="*{name}" autocomplete="off" th:classappend="${#fields.hasErrors('name')} ? ' is-invalid' : ''">
                        <div class="invalid-feedback" th:errors="*{name}"></div>
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="email">E-mail *</label>
                        <input id="email" type="email" class="form-control" th:field="*{email}" autocomplete="off" th:classappend="${#fields.hasErrors('email')} ? ' is-invalid' : ''">
                        <div class="invalid-feedback" th:errors="*{email}"></div>
                        <div class="form-text">Od 8 do 128 znaków.</div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="password" th:text="${editing} ? 'Nowe hasło' : 'Hasło *'"></label>
                        <input id="password" type="password" class="form-control" th:field="*{password}" autocomplete="off" th:classappend="${#fields.hasErrors('password')} ? ' is-invalid' : ''">
                        <div class="invalid-feedback" th:errors="*{password}"></div>
                        <div class="form-text" th:text="${editing} ? 'Pozostaw puste, aby zachować obecne hasło.' : 'Minimum 8 znaków, co najmniej jedna wielka i jedna mała litera.'"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="passwordConfirmation">Powtórz hasło <span th:if="${!editing}">*</span></label>
                        <input id="passwordConfirmation" type="password" class="form-control" th:field="*{passwordConfirmation}" autocomplete="off" th:classappend="${#fields.hasErrors('passwordConfirmation')} ? ' is-invalid' : ''">
                        <div class="invalid-feedback" th:errors="*{passwordConfirmation}"></div>
                    </div>
                </div>
                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary" th:text="${editing} ? 'Zapisz' : 'Dodaj'"></button>
                    <a class="btn btn-outline-secondary" th:href="@{/admin/users}">Anuluj</a>
                </div>
            </form>
        </div>
    </section>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
