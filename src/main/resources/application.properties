spring.application.name=cartscheduler
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/cartscheduler?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:cartscheduler}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:cartscheduler}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# Session lifetime used by the MVC administration panel. It can be overridden
# without rebuilding the application, for example: ADMIN_SESSION_TIMEOUT=PT2H.
admin.session-timeout=${ADMIN_SESSION_TIMEOUT:PT1H}
server.servlet.session.timeout=${admin.session-timeout}

# Maximum total time spent finding and optimizing one schedule. When a valid
# variant was found before the deadline, that best result is persisted.
schedule-generation.search-time-limit=${SCHEDULE_GENERATION_SEARCH_TIME_LIMIT:PT20S}
# Set to true together with schedule-generation.schedule-id to calculate a
# schedule from the console without writing participant assignments.
schedule-generation.dry-run=${SCHEDULE_GENERATION_DRY_RUN:false}

# Set to true to create the next calendar schedule from config_schedule_days.
# The console process exits after this one-off operation completes.
schedule-calendar-generation.enabled=${SCHEDULE_CALENDAR_GENERATION_ENABLED:false}
# Validity of one automatically created invitation token. Spring Duration format.
new-schedule-autoinvitement.expiration=${NEW_SCHEDULE_AUTOINVITEMENT_EXPIRATION:P7D}

# Directory used by the console schedule export. A relative path is resolved
# from the application's working directory.
schedule-export.output-directory=${SCHEDULE_EXPORT_OUTPUT_DIRECTORY:build/generated-schedules}

jwt.secret=${JWT_SECRET:Y2FydHNjaGVkdWxlci1kb2NrZXItZGV2ZWxvcG1lbnQtand0LXNlY3JldC1rZXktMzItYnl0ZXMtb3ItbW9yZQ==}
jwt.expiration=${JWT_EXPIRATION:3600000}
