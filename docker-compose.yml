services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cartscheduler}
      MYSQL_USER: ${MYSQL_USER:-cartscheduler}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cartscheduler}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-cartscheduler-root}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u${MYSQL_USER:-cartscheduler} -p${MYSQL_PASSWORD:-cartscheduler} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      database:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://database:3306/${MYSQL_DATABASE:-cartscheduler}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-cartscheduler}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-cartscheduler}
      JWT_SECRET: ${JWT_SECRET:-Y2FydHNjaGVkdWxlci1kb2NrZXItZGV2ZWxvcG1lbnQtand0LXNlY3JldC1rZXktMzItYnl0ZXMtb3ItbW9yZQ==}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  mysql_data:
