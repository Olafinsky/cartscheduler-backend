plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.cartscheduler'
version = '0.0.1-SNAPSHOT'
description = 'Backend application for CartScheduler'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-mysql'

    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    runtimeOnly 'com.mysql:mysql-connector-j'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // JUnit Jupiter, Mockito and AssertJ for unit tests.
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // MVC/JWT security tests.
    testImplementation 'org.springframework.security:spring-security-test'

    // Isolated MySQL containers for integration and functional tests.
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def integrationTestSourceSet = sourceSets.create('integrationTest') {
    java.srcDir 'src/integrationTest/java'
    resources.srcDir 'src/integrationTest/resources'
    compileClasspath += project.sourceSets.main.output
    runtimeClasspath += project.sourceSets.main.output
}

def functionalTestSourceSet = sourceSets.create('functionalTest') {
    java.srcDir 'src/functionalTest/java'
    resources.srcDir 'src/functionalTest/resources'
    compileClasspath += project.sourceSets.main.output
    runtimeClasspath += project.sourceSets.main.output
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
    functionalTestImplementation.extendsFrom testImplementation
    functionalTestRuntimeOnly.extendsFrom testRuntimeOnly
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

tasks.register('integrationTest', Test) {
    description = 'Runs integration tests against Testcontainers-managed services.'
    group = 'verification'
    dependsOn tasks.named('integrationTestClasses')
    testClassesDirs = integrationTestSourceSet.output.classesDirs
    classpath = integrationTestSourceSet.runtimeClasspath
    include '**/*IT.class'
    shouldRunAfter tasks.named('test')
}

tasks.register('functionalTest', Test) {
    description = 'Runs functional API tests against the full application.'
    group = 'verification'
    dependsOn tasks.named('functionalTestClasses')
    testClassesDirs = functionalTestSourceSet.output.classesDirs
    classpath = functionalTestSourceSet.runtimeClasspath
    include '**/*FunctionalTest.class'
    shouldRunAfter tasks.named('integrationTest')
}

tasks.named('check') {
    dependsOn tasks.named('integrationTest')
    dependsOn tasks.named('functionalTest')
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()

    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

tasks.named('bootJar') {
    archiveFileName = 'app.jar'
}
